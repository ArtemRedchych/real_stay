services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: real_stay
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://postgres:postgres@db:5432/real_stay
      STORAGE: local
      LOCAL_STORAGE_DIR: /data
      PUBLIC_API_URL: http://localhost:4000
      APP_ORIGIN: http://localhost:8080,http://localhost:5173
      AUTH_PROVIDER: dev
      JWT_SECRET: compose-only-secret
      SEED_ON_BOOT: "true"
    volumes: ["photos:/data"]
    ports: ["4000:4000"]
  app:
    build:
      context: ./app
      args: { VITE_API_URL: http://localhost:4000 }
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  photos: {}
