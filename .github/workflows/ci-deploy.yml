# Checks on every push and PR; deploy to the Dialogis production GCP project on main.
# Identities and targets come from repository variables, set once after the dialogis_infra PR is applied:
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_PUBLISHER_SA                realstay-publisher@<shared-project>.iam.gserviceaccount.com
#   GCP_DEPLOYER_SA                 realstay-deployer@<prod-project>.iam.gserviceaccount.com
#   GCP_SHARED_PROJECT, GCP_PROJECT, GCP_REGION (default europe-west3)
#   IMAGE_URI                       europe-west3-docker.pkg.dev/<shared-project>/<repo>/realstay-api
#   CLOUD_RUN_SERVICE               realstay-api
#   APP_BUCKET                      the static origin bucket for the app
#   API_URL                         https://realstay.dialogislabs.com/api   (baked into the app build)
#   APP_URL                         https://realstay.dialogislabs.com
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: Type-check, unit tests, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: API dependencies
        run: npm ci
        working-directory: api
      - name: API type-check and build
        run: npm run build
        working-directory: api
      - name: API unit tests (domain rules)
        run: npx jest src/domain --maxWorkers=2
        working-directory: api
      - name: App dependencies
        run: npm ci
        working-directory: app
      - name: App type-check and build
        run: npx tsc -b && npx vite build
        working-directory: app

  publish:
    name: Build and push the API image
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate as the image publisher
        id: auth_publish
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_SHARED_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SA }}
          token_format: access_token
      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth_publish.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/amd64
          push: true
          tags: ${{ vars.IMAGE_URI }}:main-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose the immutable reference
        id: reference
        run: echo "image=${{ vars.IMAGE_URI }}@${{ steps.image.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Roll the API and publish the app
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      REGION: ${{ vars.GCP_REGION || 'europe-west3' }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate as the deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Roll the API
        run: |
          gcloud run services update "${{ vars.CLOUD_RUN_SERVICE || 'realstay-api' }}" \
            --image="$IMAGE" --region="$REGION" --project="${{ vars.GCP_PROJECT }}" --quiet
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build the app against the hosted API
        run: npm ci && npx vite build
        working-directory: app
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - name: Publish the app to the static origin
        run: |
          gsutil -m rsync -r -d app/dist "gs://${{ vars.APP_BUCKET }}"
          gsutil -m setmeta -h "Cache-Control:no-cache" "gs://${{ vars.APP_BUCKET }}/index.html"
      - name: Smoke
        run: |
          curl -fsS --max-time 30 "${{ vars.API_URL }}/health"
          curl -fsS --max-time 30 -o /dev/null "${{ vars.APP_URL }}"
      - name: Release manifest
        run: |
          {
            echo "### RealStay release"; echo
            echo "| Field | Value |"; echo "|---|---|"
            echo "| Image | \`${IMAGE}\` |"; echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| App | ${{ vars.APP_URL }} |"; echo "| API | ${{ vars.API_URL }}/health |"
          } >> "$GITHUB_STEP_SUMMARY"
